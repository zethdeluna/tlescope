server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Docker/Railway embedded DNS. Using a variable in proxy_pass forces nginx
    # to re-resolve the backend hostname on each request instead of caching the
    # IP at startup — critical when Railway redeploys the backend and its IP
    # changes. ipv6=off: uvicorn binds to 0.0.0.0 (IPv4 only).
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Proxy all /api/* requests to the backend container.
    # BACKEND_URL is injected at container start via envsubst (nginx templates).
    # Default: http://backend:8000 (docker-compose).
    # Override for Railway: BACKEND_URL=http://<service-name>.railway.internal:8000
    location /api/ {
        rewrite               ^/api(/.*)$ $1 break;
        set                   $backend "${BACKEND_URL}";
        proxy_pass            $backend;
        proxy_set_header      Host              $host;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto $scheme;
        proxy_read_timeout    90s;
        proxy_connect_timeout 10s;
    }

    # SPA fallback: any path not matched by a static file is served index.html
    # so React Router's client-side navigation works on hard reload or direct URL.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively; Vite adds content-hash suffixes to
    # filenames so old bundles are never served from a stale cache.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|wasm|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}