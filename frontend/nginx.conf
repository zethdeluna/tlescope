server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Re-resolve backend.railway.internal every 30s so nginx picks up the new
    # backend IP after a Railway redeploy instead of using the cached startup IP.
    # ${NGINX_LOCAL_RESOLVERS} is populated at container start by nginx's own
    # 15-local-resolvers.envsh from /etc/resolv.conf — works in any environment.
    resolver ${NGINX_LOCAL_RESOLVERS} valid=30s ipv6=off;

    # Proxy all /api/* requests to the backend container.
    # BACKEND_URL is injected at container start via envsubst (nginx templates).
    # Default: http://backend:8000 (docker-compose).
    # Override for Railway: BACKEND_URL=http://<service-name>.railway.internal:8000
    location /api/ {
        set                   $backend "${BACKEND_URL}";
        rewrite               ^/api(/.*)$ $1 break;
        proxy_pass            $backend;
        proxy_set_header      Host              $host;
        proxy_set_header      X-Real-IP         $remote_addr;
        proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header      X-Forwarded-Proto $scheme;
        proxy_read_timeout    90s;
        proxy_connect_timeout 10s;
    }

    # SPA fallback: any path not matched by a static file is served index.html
    # so React Router's client-side navigation works on hard reload or direct URL.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively; Vite adds content-hash suffixes to
    # filenames so old bundles are never served from a stale cache.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|wasm|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}