server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy all /api/* requests to the backend container.
    # The trailing slash on proxy_pass strips the /api prefix before forwarding
    # so the backend sees the same paths it defines (e.g. /health, /satellites).
    location /api/ {
        proxy_pass         http://backend:8000/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # SPA fallback: any path not matched by a static file is served index.html
    # so React Router's client-side navigation works on hard reload or direct URL.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively; Vite adds content-hash suffixes to
    # filenames so old bundles are never served from a stale cache.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|wasm|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}