# alembic.ini — top-level Alembic configuration
#
# This file is read by `alembic` commands run from the backend/ directory.
# The sqlalchemy.url placeholder below is intentionally not a real URL — it
# is overridden in alembic/env.py from the DATABASE_URL environment variable,
# so the same alembic.ini works in every environment without modification.
#
# Usage (from backend/ directory):
#   alembic upgrade head       — apply all migrations to the target database
#   alembic downgrade -1       — roll back the most recent migration
#   alembic revision --autogenerate -m "describe your change"
#                              — generate a new migration from model diff

[alembic]
script_location = alembic

# Placeholder — overridden in env.py from DATABASE_URL
sqlalchemy.url = driver://user:pass@localhost/dbname

# Format for auto-generated revision file names
file_template = %%(rev)s_%%(slug)s

# Prepend sys.path with the working directory so `app` is importable
# when Alembic is run from the backend/ directory.
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S