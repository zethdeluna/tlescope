services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-tlescope}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}        # required — no default
      POSTGRES_DB:       ${POSTGRES_DB:-tlescope}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tlescope} -d ${POSTGRES_DB:-tlescope}"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ── Backend (FastAPI + APScheduler) ─────────────────────────────────────────
  # --workers 1 is deliberate: APScheduler runs inside the process, so multiple
  # workers would each launch their own scheduler and make redundant Celestrak
  # fetches. Scale horizontally with a second Compose profile + shared Redis
  # cache if higher throughput is ever needed.
  backend:
    build: ./backend
    environment:
      DATABASE_URL: >-
        postgresql://${POSTGRES_USER:-tlescope}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-tlescope}
      CELESTRAK_TIMEOUT_S: "10"
    depends_on:
      db:
        condition: service_healthy   # wait for pg_isready before starting
    ports:
      - "8000:8000"
    restart: unless-stopped

  # ── Frontend (nginx serving React + proxying /api/ to backend) ──────────────
  frontend:
    build:
      context: ./frontend
      args:
        VITE_CESIUM_TOKEN: ${VITE_CESIUM_TOKEN}      # required — baked into bundle
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped


volumes:
  pgdata: